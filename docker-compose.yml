services:
  homebot:
    build: .
    container_name: homebot
    restart: unless-stopped
    env_file: .env
    volumes:
      # role.md and notes.md live here so you can edit them without rebuilding.
      - ./workspace:/app/workspace
      # Read-only, for the free-space half of the server health check.
      # Change the host paths if your media and app data live elsewhere.
      - /media/sda2:/host/media:ro
      - /DATA:/host/appdata:ro
      # The bot's own source, so it can read it and propose pull requests.
      # It cannot deploy: the running code comes from the image, not from here.
      - /DATA/AppData/homebot/repo:/repo
